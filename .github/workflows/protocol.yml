name: protocol

on:
  push:
    paths:
      - "FencingProtocol.tla"
      - "FencingProtocol.cfg"
      - "ci/check-protocol.sh"
      - ".github/workflows/protocol.yml"
  pull_request:
    paths:
      - "FencingProtocol.tla"
      - "FencingProtocol.cfg"
      - "ci/check-protocol.sh"
      - ".github/workflows/protocol.yml"
  workflow_dispatch:

jobs:
  model-check:
    name: TLC (positive + 3 negative configs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache tla2tools.jar
        uses: actions/cache@v4
        with:
          path: tla2tools.jar
          key: tla2tools-v1
      - name: Model-check the fencing protocol
        run: ci/check-protocol.sh

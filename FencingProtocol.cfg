\* TLC model configuration for FencingProtocol.tla
\*
\* Run:  java -cp tla2tools.jar tlc2.TLC -config FencingProtocol.cfg FencingProtocol.tla
\*
\* Negative tests (all three verified to produce counterexample traces):
\*   GatewayFencing  = FALSE  -> WriterAtHead violated (PT-1, partition zombie)
\*   ReplayOnRestore = FALSE  -> WriterAtHead violated (E6 bug, stale-snapshot serve)
\*   RegistrationFencing = FALSE -> SnapshotsOnHistory violated ("slow waker" --
\*       a lineage-forging trace TLC found that the hand-written pressure
\*       tests missed; see module header)

SPECIFICATION Spec

CONSTANTS
  Hosts = {h1, h2}
  None = None
  MaxEpoch = 3
  MaxWrites = 3
  GatewayFencing = TRUE
  RegistrationFencing = TRUE
  ReplayOnRestore = TRUE

INVARIANTS
  TypeOK
  EpochsMonotoneInWAL
  AckedDurable
  WriterAtHead
  SnapshotsOnHistory
  OneInstancePerEpoch
  CurEpochBounded

\* The model deliberately runs out of epochs (MaxEpoch bound), which TLC
\* would otherwise report as deadlock.
CHECK_DEADLOCK FALSE

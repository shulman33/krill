name: mcp

on:
  push:
    paths:
      - "mcp/**"
      - ".github/workflows/mcp.yml"
  pull_request:
    paths:
      - "mcp/**"
      - ".github/workflows/mcp.yml"

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run build
